<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<title>Lista de Compras</title>
<meta name="theme-color" content="#f4efe6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#171a17" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Compras">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root {
    --bg: #f4efe6;
    --surface: #fffdf8;
    --ink: #1d231e;
    --muted: #6d7369;
    --line: #e3dccd;
    --accent: #2f6b3f;
    --accent-ink: #ffffff;
    --accent-soft: #dfeadb;
    --danger: #b3432f;
    --radius: 14px;
    --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua", Georgia, serif;
    --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
    color-scheme: light dark;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #171a17;
      --surface: #212521;
      --ink: #eef0ea;
      --muted: #9aa195;
      --line: #323832;
      --accent: #7fbf8c;
      --accent-ink: #10180f;
      --accent-soft: #263a2a;
      --danger: #e2826f;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body {
    min-height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 0 16px calc(120px + env(safe-area-inset-bottom)); }

  header {
    display: flex; align-items: flex-end; justify-content: space-between; gap: 12px;
    padding: 22px 2px 14px;
  }
  h1 { font-family: var(--serif); font-weight: 600; font-size: 34px; letter-spacing: -0.01em; margin: 0; line-height: 1; }
  .count { color: var(--muted); font-size: 14px; margin-top: 6px; font-variant-numeric: tabular-nums; }
  .menu-btn {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); display: grid; place-items: center; cursor: pointer; flex: none;
  }
  .menu-btn svg { width: 20px; height: 20px; }

  .progress { height: 4px; background: var(--line); border-radius: 4px; overflow: hidden; margin: 0 2px 18px; }
  .progress > i { display: block; height: 100%; width: 0; background: var(--accent); transition: width .3s ease; }

  section + section { margin-top: 26px; }
  .sec-head { display: flex; justify-content: space-between; align-items: center; padding: 0 2px 8px; min-height: 36px; }
  .sec-head h2 { font-size: 13px; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); margin: 0; }
  .link-btn { border: 0; background: none; color: var(--danger); font: inherit; font-size: 14px; padding: 8px 4px; cursor: pointer; }

  ul { list-style: none; margin: 0; padding: 0; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
  ul:empty { display: none; }
  li {
    display: flex; align-items: center; gap: 4px; min-height: 56px; position: relative;
    border-top: 1px solid var(--line); background: var(--surface);
    touch-action: pan-y; transition: transform .2s ease, opacity .2s ease;
  }
  li:first-child { border-top: 0; }
  li.swiping { transition: none; }

  .check {
    flex: none; width: 52px; height: 56px; border: 0; background: none; display: grid; place-items: center; cursor: pointer; padding: 0;
  }
  .box {
    width: 24px; height: 24px; border-radius: 7px; border: 2px solid var(--muted); display: grid; place-items: center;
    transition: background .15s, border-color .15s;
  }
  .box svg { width: 14px; height: 14px; opacity: 0; color: var(--accent-ink); }
  li.done .box { background: var(--accent); border-color: var(--accent); }
  li.done .box svg { opacity: 1; }

  .label { flex: 1; min-width: 0; padding: 10px 0; font-size: 17px; line-height: 1.3; overflow-wrap: anywhere; cursor: text; }
  .qty { color: var(--muted); font-size: 15px; font-variant-numeric: tabular-nums; margin-left: 6px; white-space: nowrap; }
  li.done .label { color: var(--muted); text-decoration: line-through; text-decoration-color: color-mix(in srgb, var(--muted) 60%, transparent); }

  .del {
    flex: none; width: 48px; height: 56px; border: 0; background: none; color: var(--muted); cursor: pointer; display: grid; place-items: center;
  }
  .del svg { width: 18px; height: 18px; }

  .edit-input {
    flex: 1; min-width: 0; font: inherit; font-size: 17px; border: 0; border-bottom: 2px solid var(--accent);
    background: transparent; color: var(--ink); padding: 8px 0; outline: none;
  }

  .empty { text-align: left; padding: 40px 6px; color: var(--muted); }
  .empty strong { display: block; font-family: var(--serif); color: var(--ink); font-size: 22px; font-weight: 600; margin-bottom: 6px; }

  /* Add bar */
  .addbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    border-top: 1px solid var(--line);
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    -webkit-backdrop-filter: saturate(1.4) blur(10px); backdrop-filter: saturate(1.4) blur(10px);
  }
  .addbar form { max-width: 560px; margin: 0 auto; display: flex; gap: 8px; }
  .addbar input {
    flex: 1; min-width: 0; height: 50px; border-radius: 25px; border: 1px solid var(--line); background: var(--surface);
    color: var(--ink); font: inherit; font-size: 17px; padding: 0 18px; outline: none;
  }
  .addbar input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .addbar form button {
    flex: none; width: 50px; height: 50px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
    display: grid; place-items: center; cursor: pointer;
  }
  .addbar form button svg { width: 22px; height: 22px; }
  .hint { max-width: 560px; margin: 6px auto 0; font-size: 12px; color: var(--muted); padding: 0 6px; }

  .suggest { max-width: 560px; margin: 0 auto 8px; display: flex; gap: 6px; overflow-x: auto; scrollbar-width: none; }
  .suggest::-webkit-scrollbar { display: none; }
  .suggest:empty { display: none; }
  .chip {
    flex: none; border: 1px solid var(--line); background: var(--surface); color: var(--ink); border-radius: 18px;
    height: 36px; padding: 0 14px; font: inherit; font-size: 15px; cursor: pointer;
  }

  /* Toast */
  .toast {
    position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom)); transform: translate(-50%, 20px);
    background: var(--ink); color: var(--bg); border-radius: 12px; padding: 6px 6px 6px 16px; display: flex; align-items: center; gap: 10px;
    font-size: 15px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 20; max-width: calc(100% - 32px);
  }
  .toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .toast.show { opacity: 1; transform: translate(-50%, 0); pointer-events: auto; }
  .toast button { border: 0; background: none; color: var(--accent); font: inherit; font-weight: 600; padding: 10px 12px; cursor: pointer; }
  @media (prefers-color-scheme: light) { .toast button { color: #9fd3aa; } }

  /* Sheet */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.35); opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 30; }
  .sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 31; background: var(--surface); border-radius: 20px 20px 0 0;
    padding: 8px 12px calc(16px + env(safe-area-inset-bottom)); transform: translateY(100%); transition: transform .25s ease;
    max-width: 560px; margin: 0 auto;
  }
  .sheet.open { transform: none; }
  .sheet-bg.open { opacity: 1; pointer-events: auto; }
  .sheet .grip { width: 36px; height: 5px; border-radius: 3px; background: var(--line); margin: 4px auto 10px; }
  .sheet button {
    display: block; width: 100%; text-align: left; border: 0; background: none; color: var(--ink); font: inherit; font-size: 17px;
    min-height: 52px; padding: 0 12px; border-radius: 10px; cursor: pointer;
  }
  .sheet button:active { background: var(--bg); }
  .sheet button.danger { color: var(--danger); }
  .sheet small { display: block; color: var(--muted); font-size: 13px; padding: 10px 12px 0; }

  :focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Compras</h1>
      <div class="count" id="count"></div>
    </div>
    <button class="menu-btn" id="menuBtn" aria-label="Mais opções">
      <svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
  </header>
  <div class="progress" id="progress"><i></i></div>

  <div id="emptyState" class="empty" hidden>
    <strong>Lista vazia</strong>
    Digite um item lá embaixo. Dá pra pôr quantidade: “6 ovos”, “leite x2”.
  </div>

  <section id="todoSec">
    <div class="sec-head"><h2>Para comprar</h2></div>
    <ul id="todo"></ul>
  </section>

  <section id="doneSec">
    <div class="sec-head"><h2>No carrinho</h2><button class="link-btn" id="clearDone">Limpar</button></div>
    <ul id="done"></ul>
  </section>
</div>

<div class="addbar">
  <div class="suggest" id="suggest"></div>
  <form id="addForm" autocomplete="off">
    <input id="addInput" type="text" placeholder="Adicionar item…" enterkeyhint="done" aria-label="Novo item" autocapitalize="sentences">
    <button type="submit" aria-label="Adicionar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </form>
</div>

<div class="toast" id="toast" role="status"><span id="toastMsg"></span><button id="toastUndo">Desfazer</button></div>

<div class="sheet-bg" id="sheetBg"></div>
<div class="sheet" id="sheet" role="dialog" aria-label="Opções">
  <div class="grip"></div>
  <button id="actShare">Compartilhar lista</button>
  <button id="actUncheck">Desmarcar todos</button>
  <button id="actClearAll" class="danger">Apagar lista inteira</button>
  <small>Toque no nome para editar. Arraste para o lado para apagar. A lista fica salva neste aparelho.</small>
</div>

<template id="itemTpl">
  <li>
    <button class="check" aria-label="Marcar">
      <span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span>
    </button>
    <div class="label"></div>
    <button class="del" aria-label="Apagar">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </li>
</template>

<script>
(() => {
  const KEY = 'lista-compras:v1';
  const HIST = 'lista-compras:hist';
  const $ = id => document.getElementById(id);

  let items = load(KEY, []);
  let history = load(HIST, {}); // name(lower) -> {name, n}
  let undoState = null, toastTimer = null;

  function load(k, d) { try { return JSON.parse(localStorage.getItem(k)) ?? d; } catch { return d; } }
  function save() { localStorage.setItem(KEY, JSON.stringify(items)); localStorage.setItem(HIST, JSON.stringify(history)); }
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  // "6 ovos", "leite x2", "2kg arroz", "arroz 2kg"
  function parse(raw) {
    let s = raw.trim().replace(/\s+/g, ' ');
    let qty = '';
    let m;
    if ((m = s.match(/^(.+?)\s*[x×]\s*(\d+[.,]?\d*)$/i))) { s = m[1]; qty = m[2]; }
    else if ((m = s.match(/^(\d+[.,]?\d*\s*(?:kg|g|l|ml|un|und|cx|pct|dz)?)\s+(.+)$/i))) { qty = m[1]; s = m[2]; }
    else if ((m = s.match(/^(.+?)\s+(\d+[.,]?\d*\s*(?:kg|g|l|ml|un|und|cx|pct|dz))$/i))) { s = m[1]; qty = m[2]; }
    s = s.charAt(0).toUpperCase() + s.slice(1);
    return { name: s, qty: qty.replace(/\s+/g, '') };
  }
  const fmt = it => it.name + (it.qty ? ' ' + it.qty : '');

  function add(raw) {
    const { name, qty } = parse(raw);
    if (!name) return;
    const existing = items.find(i => i.name.toLowerCase() === name.toLowerCase());
    if (existing) {
      existing.done = false;
      if (qty) existing.qty = qty;
      items = [existing, ...items.filter(i => i !== existing)];
    } else {
      items.unshift({ id: uid(), name, qty, done: false });
    }
    const k = name.toLowerCase();
    history[k] = { name, n: (history[k]?.n || 0) + 1 };
    save(); render();
  }

  function snapshot(msg) {
    undoState = JSON.stringify(items);
    $('toastMsg').textContent = msg;
    $('toast').classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => $('toast').classList.remove('show'), 4500);
  }
  $('toastUndo').onclick = () => {
    if (undoState) { items = JSON.parse(undoState); undoState = null; save(); render(); }
    $('toast').classList.remove('show');
  };

  function remove(id) {
    const it = items.find(i => i.id === id);
    snapshot(`“${it.name}” apagado`);
    items = items.filter(i => i.id !== id);
    save(); render();
  }

  function toggle(id) {
    const it = items.find(i => i.id === id);
    it.done = !it.done;
    if (navigator.vibrate) navigator.vibrate(8);
    save(); render();
  }

  function startEdit(li, it) {
    const label = li.querySelector('.label');
    const input = document.createElement('input');
    input.className = 'edit-input';
    input.value = fmt(it);
    input.enterKeyHint = 'done';
    label.replaceWith(input);
    input.focus();
    input.setSelectionRange(input.value.length, input.value.length);
    let finished = false;
    const finish = (commit) => {
      if (finished) return; finished = true;
      if (commit) {
        const v = input.value.trim();
        if (!v) { remove(it.id); return; }
        const p = parse(v); it.name = p.name; it.qty = p.qty; save();
      }
      render();
    };
    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') { e.preventDefault(); finish(true); }
      if (e.key === 'Escape') finish(false);
    });
    input.addEventListener('blur', () => finish(true));
  }

  function makeItem(it) {
    const li = $('itemTpl').content.firstElementChild.cloneNode(true);
    li.dataset.id = it.id;
    li.classList.toggle('done', it.done);
    const label = li.querySelector('.label');
    label.textContent = it.name;
    if (it.qty) { const q = document.createElement('span'); q.className = 'qty'; q.textContent = /^\d+([.,]\d+)?$/.test(it.qty) ? '×' + it.qty : it.qty; label.append(q); }
    li.querySelector('.check').setAttribute('aria-label', it.done ? `Desmarcar ${it.name}` : `Marcar ${it.name}`);
    li.querySelector('.check').onclick = () => toggle(it.id);
    li.querySelector('.del').onclick = () => remove(it.id);
    label.onclick = () => startEdit(li, it);
    swipe(li, it.id);
    return li;
  }

  function swipe(li, id) {
    let x0 = 0, y0 = 0, dx = 0, active = false, locked = false;
    li.addEventListener('touchstart', e => {
      if (e.target.closest('input')) return;
      x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; dx = 0; active = true; locked = false;
    }, { passive: true });
    li.addEventListener('touchmove', e => {
      if (!active) return;
      const mx = e.touches[0].clientX - x0, my = e.touches[0].clientY - y0;
      if (!locked) {
        if (Math.abs(my) > 10 && Math.abs(my) > Math.abs(mx)) { active = false; return; }
        if (Math.abs(mx) > 10) { locked = true; li.classList.add('swiping'); }
      }
      if (locked) { dx = mx; li.style.transform = `translateX(${dx}px)`; li.style.opacity = String(1 - Math.min(Math.abs(dx) / 300, .6)); }
    }, { passive: true });
    li.addEventListener('touchend', () => {
      if (!active) return; active = false;
      li.classList.remove('swiping');
      if (Math.abs(dx) > 110) {
        li.style.transform = `translateX(${dx > 0 ? '' : '-'}110%)`; li.style.opacity = '0';
        setTimeout(() => remove(id), 180);
      } else { li.style.transform = ''; li.style.opacity = ''; }
    });
  }

  function renderSuggest() {
    const q = $('addInput').value.trim().toLowerCase();
    const onList = new Set(items.map(i => i.name.toLowerCase()));
    let list = Object.values(history).filter(h => !onList.has(h.name.toLowerCase()));
    if (q) list = list.filter(h => h.name.toLowerCase().includes(q) && h.name.toLowerCase() !== q);
    list.sort((a, b) => b.n - a.n);
    const box = $('suggest'); box.innerHTML = '';
    for (const h of list.slice(0, 12)) {
      const b = document.createElement('button');
      b.type = 'button'; b.className = 'chip'; b.textContent = h.name;
      b.onclick = () => { add(h.name); $('addInput').value = ''; renderSuggest(); };
      box.append(b);
    }
  }

  function render() {
    const todo = items.filter(i => !i.done), done = items.filter(i => i.done);
    const tUl = $('todo'), dUl = $('done');
    tUl.replaceChildren(...todo.map(makeItem));
    dUl.replaceChildren(...done.map(makeItem));
    $('todoSec').hidden = !todo.length;
    $('doneSec').hidden = !done.length;
    $('emptyState').hidden = items.length > 0;
    $('progress').hidden = !items.length;
    $('progress').firstElementChild.style.width = items.length ? (done.length / items.length * 100) + '%' : '0';
    $('count').textContent = !items.length ? 'Nada pendente'
      : todo.length === 0 ? 'Tudo no carrinho ✓'
      : `${todo.length} ${todo.length === 1 ? 'item' : 'itens'} faltando` + (done.length ? ` · ${done.length} no carrinho` : '');
    renderSuggest();
  }

  $('addForm').addEventListener('submit', e => {
    e.preventDefault();
    const v = $('addInput').value;
    // allow comma-separated: "leite, pão, 6 ovos"
    v.split(/[,;\n]/).map(s => s.trim()).filter(Boolean).reverse().forEach(add);
    $('addInput').value = '';
    renderSuggest();
  });
  $('addInput').addEventListener('input', renderSuggest);

  $('clearDone').onclick = () => {
    const n = items.filter(i => i.done).length;
    snapshot(`${n} ${n === 1 ? 'item removido' : 'itens removidos'}`);
    items = items.filter(i => !i.done); save(); render();
  };

  // Sheet
  const openSheet = o => { $('sheet').classList.toggle('open', o); $('sheetBg').classList.toggle('open', o); };
  $('menuBtn').onclick = () => openSheet(true);
  $('sheetBg').onclick = () => openSheet(false);
  $('actUncheck').onclick = () => { items.forEach(i => i.done = false); save(); render(); openSheet(false); };
  $('actClearAll').onclick = () => {
    openSheet(false);
    if (!items.length) return;
    snapshot('Lista apagada'); items = []; save(); render();
  };
  $('actShare').onclick = async () => {
    openSheet(false);
    const todo = items.filter(i => !i.done);
    const text = 'Lista de compras:\n' + (todo.length ? todo : items).map(i => '• ' + fmt(i)).join('\n');
    try {
      if (navigator.share) await navigator.share({ text });
      else { await navigator.clipboard.writeText(text); undoState = null; $('toastMsg').textContent = 'Lista copiada'; $('toast').classList.add('show'); setTimeout(() => $('toast').classList.remove('show'), 2000); }
    } catch {}
  };

  // Sync between tabs
  window.addEventListener('storage', e => { if (e.key === KEY) { items = load(KEY, []); render(); } });

  render();
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
</script>
</body>
</html>
